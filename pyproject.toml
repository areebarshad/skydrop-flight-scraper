[project]
name = "flight-alert-scraper"
version = "0.1.0"
description = "Monitors flight routes and sends email alerts when prices or availability change."
readme = "README.md"
authors = [
    { name = "Areeb Arshad", email = "areebarshad@vt.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.19",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "patchright>=1.48",
]

[project.scripts]
flight-alert-scraper = "flight_alert_scraper.cli:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "time-machine>=3.5.1",
]
