<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}skydrop{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
<nav class="nav">
  <a class="nav-brand" href="/">&#x2708; skydrop</a>
  <div class="nav-routes">
    {% for r in all_routes %}
    <a class="nav-route {% if r.query_key == query_key %}active{% endif %}"
       href="/routes/{{ r.query_key }}">
      {{ r.origin }}&rarr;{{ r.destination }}
    </a>
    {% endfor %}
  </div>
  <div class="nav-actions">
    <a class="btn btn-sm" href="/settings">Settings</a>
  </div>
</nav>
<main class="main">
  {% block content %}{% endblock %}
</main>
<footer class="footer">
  <span>skydrop</span>
</footer>
</body>
</html>
