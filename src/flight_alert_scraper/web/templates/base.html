<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}skydrop{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>

<!-- Ambient background mesh -->
<div class="ambient-mesh" aria-hidden="true">
  <div class="orb-3"></div>
</div>

<!-- Floating glass navbar -->
<div class="nav-wrapper">
  <nav class="nav">
    <a class="nav-brand" href="/">
      <div class="nav-brand-icon">&#x2708;</div>
      skydrop
    </a>
    <div class="nav-divider"></div>
    <div class="nav-routes">
      <a class="nav-route {% if active_tab == 'logs' %}active{% endif %}" href="/logs">Logs</a>
      <a class="nav-route {% if active_tab == 'alerts' %}active{% endif %}" href="/alerts">Alerts</a>
    </div>
    <div class="scraper-status">
      <div class="pulse-dot"></div>
      <span>Live</span>
    </div>
  </nav>
</div>

<main class="main">
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  skydrop &mdash; flight price monitor
  <div class="footer-author">Author: Areeb Arshad &nbsp;&middot;&nbsp; Data Science, Statistics, and Mathematics @ Virginia Tech</div>
</footer>
</body>
</html>
