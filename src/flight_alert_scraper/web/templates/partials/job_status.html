<div id="job-status"
     hx-get="/jobs/{{ job_id }}"
     hx-trigger="load, every 2s"
     hx-target="this"
     hx-swap="outerHTML">
  <span class="job-msg job-{{ job.state }}">
    {% if job.state in ("pending", "running") %}
    <svg class="spin" width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="2.5"
              stroke-dasharray="17 17" stroke-linecap="round" opacity="0.85"/>
    </svg>
    {{ job.message }}
    {% else %}{{ job.message }}
    {% endif %}
  </span>
</div>
