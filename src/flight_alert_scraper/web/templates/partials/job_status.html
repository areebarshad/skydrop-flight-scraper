<div id="job-status"
     hx-get="/jobs/{{ job_id }}"
     hx-trigger="load, every 2s"
     hx-target="this"
     hx-swap="outerHTML">
  <span class="job-msg job-{{ job.state }}">
    {% if job.state in ("pending", "running") %}
    <svg class="hourglass" width="12" height="14" viewBox="0 0 12 14" fill="none" aria-hidden="true">
      <line x1="0.5" y1="0.8" x2="11.5" y2="0.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="0.5" y1="13.2" x2="11.5" y2="13.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M1.5 1.5L6 7l-4.5 5.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M10.5 1.5L6 7l4.5 5.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M2 1.8 L6 6.5 L10 1.8 Z" fill="currentColor" opacity="0.65"/>
    </svg>
    {{ job.message }}
    {% else %}{{ job.message }}
    {% endif %}
  </span>
</div>
